name: Build seminar calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build combined calendar
        run: python build_calendar.py

      - name: Upload debugging files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminar-scrape-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seminars.ics
          if git diff --cached --quiet; then
            echo "Calendar is unchanged"
          else
            git commit -m "Update seminar calendar"
            git push
          fi
