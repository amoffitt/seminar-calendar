calendar:
  name: Emory Seminars
  output: docs/seminars.ics
  timezone: America/New_York
  # Compact Outlook title formats. Missing fields are removed cleanly.
  title_format: "[{program}] {speaker} — {talk_title}"
  default_duration_minutes: 60

filters:
  # Keep past events for this many days. Use 0 to exclude all past events.
  include_past_days: 0

  # Applied to all sources, case-insensitively.
  global_exclude_title_patterns:
    - "Summer Break"
    - "Winter Break"

sources:
  winship:
    enabled: true

    # Empty include lists mean "include everything unless excluded."
    include_program_patterns:
      - "Elkin Lecture"
      - "Grand Rounds"
      - "Cancer Immunology"
      - "Cell and Molecular Biology"
      - "Discovery and Developmental Therapeutics"

    # Suggested starting exclusions. Comment out anything you want to retain.
    exclude_title_patterns:
      - "Summer Break"
      - "Winter Break"

    exclude_event_type_patterns: []

    # Optional examples:
    # include_program_patterns:
    #   - "Elkin Lecture"
    #   - "Grand Rounds"
    #   - "Cancer Immunology"
    #   - "Cell and Molecular Biology"
    #   - "Discovery and Developmental Therapeutics"

  human_genetics:
    enabled: true
    include_sections:
      - "Seminars"
      - "Steven T. Warren Distinguished Lecture"
      - "Grand Rounds"
      - "Research in Progress"

    exclude_sections:
      - "Clinical Conference"
      - "Faculty Career Path Talk"
      - "Conversations with Emory Leaders"
      - "Early Career Seminar"

    exclude_tbd_speakers: true

  bmi:
    enabled: true
    exclude_title_patterns: []


  gmb:
    enabled: true
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJD4NRDHNVA4WNm_h_srB-WSOMg5C3X3GnU9CqCcmm9aAqMKAe7yIO4Zt-V4g5FjNK1gdFuUf4VBb0/pub?gid=0&single=true&output=csv"

  cancer_genomics:
    enabled: true
    url: "https://docs.google.com/document/d/e/2PACX-1vRTAlKP3nox8yRh3u-qzro4Qc0oEcjRrjnFR3oWTuHeFHaS4_TSbhmhoE5vSXWCghakPKr5Fl4XzgB7/pub"
